# 배포용 (EC2 한 대): DB + API 서버 + Caddy(HTTPS). 개발용은 docker-compose.yml(DB만, 5433).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# 필요한 파일 (둘 다 커밋하지 않는다)
# - 루트 .env       : POSTGRES_PASSWORD, DOMAIN (.env.prod.example 참고)
# - server/.env     : JWT_SECRET, ANTHROPIC_API_KEY, GOOGLE_VISION_API_KEY (DATABASE_URL은 여기서 덮어쓴다)
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: anomie
      POSTGRES_USER: anomie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?루트 .env에 POSTGRES_PASSWORD를 넣어 주세요}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 포트를 열지 않는다: 같은 compose 안의 server만 db:5432로 접속한다
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anomie -d anomie"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    env_file: server/.env
    environment:
      # server/.env의 개발용 주소(localhost:5433) 대신 compose 안의 db를 쓴다
      DATABASE_URL: postgresql://anomie:${POSTGRES_PASSWORD}@db:5432/anomie
      PORT: "3000"
      # Caddy 한 단계 뒤에 있으므로 호출 제한이 실제 사용자 IP로 세어지게 한다
      TRUST_PROXY: "1"
    volumes:
      - ./server/logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?루트 .env에 DOMAIN을 넣어 주세요}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # 발급받은 인증서. 지우면 다시 발급받는다
      - caddy_config:/config
    depends_on:
      - server

volumes:
  pgdata:
  caddy_data:
  caddy_config:
